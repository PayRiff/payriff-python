[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "payriff"
version = "0.1.0"
description = "Python client for the Payriff merchant API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
keywords = ["payriff", "payments", "azerbaijan"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/payriff/payriff-python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/payriff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]